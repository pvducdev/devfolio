name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: Lint & Format Check
        run: bun run check

      - name: Build
        run: bun run build
        env:
          VITE_LOGTAIL_SOURCE_TOKEN: ci-placeholder
          VITE_LOGTAIL_INGESTING_HOST: ci-placeholder.invalid

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
