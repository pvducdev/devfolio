name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & Format Check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          VITE_LOGTAIL_SOURCE_TOKEN: ci-placeholder
          VITE_LOGTAIL_INGESTING_HOST: ci-placeholder.invalid

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
